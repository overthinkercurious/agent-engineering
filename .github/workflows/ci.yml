name: ci

# Every gate in this repository was local and opt-in: ~380 assertions across
# eleven checks, and nothing that ran them on a push. A rule whose command
# nobody runs is the same suggestion this kit refuses to let a project record
# as a rule, so it should not have been one here either.
#
# Node only, no dependencies to install: the suite is deliberately
# dependency-free (see AGENTS.md, "Portability"), so `npm ci` has nothing to do
# and is omitted rather than left in as decoration.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    # Both, because four of the eleven checks are shell scripts and the runner
    # resolves Git Bash by absolute path on Windows specifically to avoid the
    # WSL shim. That path only gets exercised if Windows actually runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm test
        run: npm test

  install:
    # Separate job: this one reaches the network to exercise `npx skills add`
    # for all eight AGENT_IDs, so it must not be able to fail the suite job for
    # an unrelated reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install contract
        run: npm run test:install
