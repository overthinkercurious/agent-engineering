# targets.yml - the only file in this kit that knows anything tool-specific.
# Adding support for a tool is a block here, never a code change.
#
# This file lives inside the skill rather than at the repo root because the
# skills CLI copies only the skill directory into a project. A targets.yml at
# the repo root would be unreachable from an installed skill.
#
# PROVENANCE
# `skills_dir` values were read out of the `skills` CLI agent registry
# (npm `skills` v1.7.0, src/agents.ts) and checked against each tool's official
# documentation. The registry decides where the installer writes; the tool
# documentation proves the IDE actually discovers that path. Verified
# 2026-09-17.
#
# THE BIG FINDING
# `.agents/skills` is the convergent location: 22 of the 79 agents in that
# registry install there, including Codex, Cursor, Gemini CLI, Antigravity,
# GitHub Copilot and OpenCode. Claude Code is the only outlier among the
# tools this kit targets. So this table has two skills_dir values, not six.
#
# Tools fully covered by the `agents-md` entry below (same instruction file,
# same skills dir, so a separate block would be a duplicate row):
#   codex, cursor, antigravity-cli, amp, opencode, github-copilot,
#   droid, kilo, roo, openhands, goose, continue, qwen-code, trae, zencoder
#
# INSTALL NOTE (not read by any script, but the reason this kit works on
# Windows): `npx skills add` symlinks agent directories to `.agents/skills`
# by default. Git for Windows does not create symlinks unless the user has
# Developer Mode on, so a fresh clone gets text stubs instead of skills.
# Install with `--copy`.

version: 1

defaults:
  universal_skills_dir: .agents/skills
  canonical_instruction_file: AGENTS.md
  # Isolated-dispatch capability for Stage 3's fan-out and Stage 5's Verify.
  # native-parallel: confirmed concurrent isolated dispatch, cited below.
  # native-sequential: confirmed isolation, concurrency not confirmed.
  # none: the default. Assume this for any target below with no `dispatch`
  # key - never infer a tier a row has not verified. On `none`, the isolated
  # passes run sequentially in this session and say so; they are not skipped.
  dispatch: none

targets:

  agents-md:
    display: "AGENTS.md (cross-tool canonical)"
    installer_ids: "codex,cursor,opencode"
    instruction_file: AGENTS.md
    pointer_style: block
    skills_dir: .agents/skills
    detect: "AGENTS.md,.agents/skills,.agents"
    always: "true"
    confidence: high
    notes: "Codex, Cursor and OpenCode all officially discover project skills from .agents/skills. Codex uses /skills or $name, Cursor exposes skills in its slash picker, and OpenCode loads them through its skill tool."
    verified: "2026-09-17 skills CLI v1.7.0 registry; developers.openai.com/codex/skills; cursor.com/docs/skills; opencode.ai/docs/skills"

  claude-code:
    display: "Claude Code"
    installer_ids: "claude-code"
    instruction_file: CLAUDE.md
    pointer_style: import
    skills_dir: .claude/skills
    detect: "CLAUDE.md,.claude"
    confidence: high
    notes: "Claude Code reads CLAUDE.md and does NOT read AGENTS.md. Its docs name an @AGENTS.md import as the bridge, and specifically recommend the import over a symlink on Windows."
    verified: "2026-09-17 code.claude.com/docs/en/skills"
    dispatch: native-parallel
    dispatch_notes: "Subagents run through the Task tool; each starts with a fresh, isolated context window that does not inherit the parent conversation, and several can be launched in one turn for parallel fan-out. The only channel from parent to subagent is the prompt string, so a dispatched expert must be given its paths and scope explicitly - it cannot see what the parent already read."
    dispatch_verified: "2026-09-20 code.claude.com/docs/en/sub-agents"

  antigravity:
    display: "Google Antigravity IDE"
    installer_ids: "antigravity,antigravity-cli"
    instruction_file: .agents/rules/agent-engineering.md
    pointer_style: block
    skills_dir: .agents/skills
    detect: ".agents/skills,.agents/rules,.agent/skills,.agent/rules,.agents/plugins,_agents/plugins"
    confidence: high
    notes: "Antigravity 2.0 loads workspace skills from .agents/skills and exposes them through semantic matching and /<skill-name>. The IDE still supports legacy .agent paths, but new output uses .agents."
    verified: "2026-09-17 antigravity.google/docs/ide/skills and antigravity.google/docs/migration/workflows-to-skills"
    dispatch: native-parallel
    dispatch_notes: "Parent agent calls invoke_subagent, which can be invoked multiple times concurrently; each subagent starts with a clean context window (does not inherit the parent's conversation history) and returns a result message when done. Use workspace mode inherit for Stage 3/5 dispatch - nothing here writes application code."
    dispatch_verified: "2026-09-17 antigravity.google/docs/subagents/"

  gemini-cli:
    display: "Gemini CLI"
    installer_ids: "gemini-cli"
    instruction_file: GEMINI.md
    pointer_style: block
    skills_dir: .agents/skills
    detect: "GEMINI.md,.gemini"
    confidence: medium
    notes: "Gemini CLI officially treats .agents/skills as a workspace alias for .gemini/skills. Use /skills reload after installation. It reads GEMINI.md rather than AGENTS.md, so the project pointer is written out in full."
    verified: "2026-09-17 skills CLI v1.7.0 registry and geminicli.com/docs/cli/using-agent-skills"

  github-copilot:
    display: "GitHub Copilot"
    installer_ids: "github-copilot"
    instruction_file: .github/copilot-instructions.md
    pointer_style: block
    skills_dir: .agents/skills
    detect: ".github/copilot-instructions.md"
    confidence: medium
    notes: "GitHub Copilot officially supports .agents/skills as an alternative project location and exposes user-invocable skills as /<skill-name>. Only write the Copilot instruction pointer when its instruction file already exists."
    verified: "2026-09-17 skills CLI v1.7.0 registry and docs.github.com Copilot CLI skills reference"
